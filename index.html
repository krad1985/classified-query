<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名冊查詢 - 報名資料查詢</title>
  <meta name="description" content="依區域 / 教室欄位篩選，依分類檢視報名資料">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="seal" aria-hidden="true">冊</span>
      <div class="header-title">
        <h1>報名名冊</h1>
        <p class="subtitle">依區域／教室篩選，翻閱各分類名冊</p>
      </div>
      <a href="admin.html" class="admin-link header-admin-link">管理後台</a>
    </div>
  </header>

  <main class="container">
    <!-- 活動分頁 -->
    <nav class="activity-tabs" id="activityTabs" aria-label="活動分頁" role="tablist">
      <!-- 動態產生 -->
    </nav>

    <!-- 分類列 -->
    <div class="category-bar" id="categoryBar" style="display:none;">
      <span class="category-label" id="categoryLabel"></span>
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="category-filter">
        <label for="categorySearch" class="visually-hidden">搜尋分類</label>
        <input type="search" id="categorySearch" placeholder="找分類…" autocomplete="off">
      </div>
      <button class="btn btn-secondary btn-sm" id="btnCopyLink" style="display:none;">複製連結</button>
    </div>

    <!-- 密碼鎖 Modal -->
    <dialog id="pwdModal" class="modal">
      <div class="modal-content">
        <header class="modal-header">
          <h3 id="pwdModalTitle">此分類已鎖定</h3>
          <button type="button" class="modal-close" id="pwdModalClose" aria-label="關閉">&times;</button>
        </header>
        <div class="modal-body">
          <p class="hint" id="pwdModalDesc">請輸入系統提供的密碼以檢視此分類。</p>
          <div class="form-group">
            <label for="categoryPwdInput">分類密碼</label>
            <input type="password" id="categoryPwdInput" placeholder="輸入密碼" autocomplete="off">
          </div>
          <p class="hint" id="pwdModalHint"></p>
        </div>
        <footer class="modal-footer">
          <button type="button" class="btn btn-secondary" id="pwdModalCancel">取消</button>
          <button type="button" class="btn btn-primary" id="pwdModalConfirm">解鎖查看</button>
        </footer>
      </div>
    </dialog>

    <!-- 搜尋 / 篩選列 -->
    <div class="search-bar" id="searchBar" style="display:none;">
      <label for="searchInput" class="visually-hidden">關鍵字搜尋</label>
      <input type="search" id="searchInput" placeholder="輸入姓名、班級等關鍵字篩選" autocomplete="off">
      <span class="result-count" id="resultCount"></span>
      <div class="search-actions">
        <button class="btn btn-secondary btn-sm" id="btnExportCsv" style="display:none;">匯出名冊</button>
      </div>
    </div>

    <!-- 資料表格區 -->
    <section class="table-wrapper" id="tableWrapper" style="display:none;">
      <table id="dataTable" aria-live="polite">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
    <p class="empty-state" id="emptyState" style="display:none;">此分類暫無資料。</p>

    <!-- 頁尾 -->
    <footer class="status-bar" id="statusBar" aria-live="polite">
      <span id="lastUpdated"></span>
      <span>不積跬步，無以至千里</span>
    </footer>
  </main>

  <script src="js/config.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
